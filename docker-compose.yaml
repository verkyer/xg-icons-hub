services:
  xg-icons-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: xg-icons-hub:dev
    container_name: xg-icons-hub-dev
    ports:
      - "28080:5000"
    volumes:
      - ./images:/app/images
    environment:
      - SITE_NAME=xg-icons-hub
      # 可选变量（按需打开）：
      # - LOGO_IMG=favicon.ico        # 路径或完整 URL
      # - FAVICON=/static/favicon.ico
      # - COPYRIGHT=HTML、文本
      # - ICP=粤ICP备12345678号-1
      # - SEO_DESC=站点描述
      # - UMAMI_URL=https://cloud.umami.is
      # - UMAMI_SITE_ID=网站 ID
    restart: unless-stopped
